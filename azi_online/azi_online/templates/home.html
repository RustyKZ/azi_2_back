<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% load socialaccount %}
    <a href="/accounts/signup">SignUp</a>
    <a href="/accounts/login">Login</a>
    <a href="/accounts/logout">Logout</a>
    <br>
    <a href="#" id="functionLink">Function</a>
    <br>
    <hr>
    <a href="#" id="remoteSignup">Remote Signup</a>
    <br>
    <a href="#" id="remoteLogin">Remote Login</a>
    <br>
    <a href="#" id="remoteLogout">Remote Logout</a>
    <hr>
    <a href="{% provider_login_url 'google' %}">Login with Google</a>
    <br>
    <a href="#" id="remoteGoogle">Remote Google</a>

    {% if user.is_authenticated %}
        <p>Email & name: {{ user.email }} - {{ user.username }}</p>
    {% else %}
        <p>Email: None</p>
    {% endif %}

    <script>
        document.getElementById('functionLink').onclick = function() {
            // Выполняем AJAX запрос
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/run_function/', true);

            xhr.onload = function() {
                if (xhr.status == 200) {
                    // Обработка успешного ответа
                    var response = JSON.parse(xhr.responseText);
                    alert(response.result);
                }
            };
            xhr.send();
        };

        document.getElementById('remoteSignup').onclick = function() {
            // Выполняем AJAX запрос
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/run_signup/', true);

            xhr.onload = function() {
                if (xhr.status == 200) {
                    // Обработка успешного ответа
                    var response = JSON.parse(xhr.responseText);
                    alert(response.result);
                }
            };
            xhr.send();
        };

        document.getElementById('remoteLogin').onclick = function() {
            // Выполняем AJAX запрос
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/run_login/', true);

            xhr.onload = function() {
                if (xhr.status == 200) {
                    // Обработка успешного ответа
                    var response = JSON.parse(xhr.responseText);
                    alert(response.result);
                }
            };
            xhr.send();
        };

        document.getElementById('remoteLogout').onclick = function() {
            // Выполняем AJAX запрос
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/run_logout/', true);

            xhr.onload = function() {
                if (xhr.status == 200) {
                    // Обработка успешного ответа
                    var response = JSON.parse(xhr.responseText);
                    alert(response.result);
                }
            };
            xhr.send();
        };

        document.getElementById('remoteGoogle').onclick = function() {
            // Выполняем AJAX запрос
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/run_google/', true);
            xhr.onload = function() {
                if (xhr.status == 200) {
                    // Обработка успешного ответа
                    var response = JSON.parse(xhr.responseText);
                    console.log(response.url);
                    var googleAuthUrl = response.url;
                    window.location.href = googleAuthUrl;
                }
            };
            xhr.send();
            
        };


    </script>

</body>
</html>
